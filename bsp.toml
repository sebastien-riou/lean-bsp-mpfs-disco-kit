[bsp]
name = "mpfs-disco-kit"
lean_bsp_contract_version = "1.1"
version = "0.1.0"
description = "Microchip PolarFire SoC Discovery Kit (MPFS095T: one E51 and four U54 RISC-V harts)"
maintainer = "sebastien.riou@pqshield.com"
entry_point = "bsp_cli.py"

[bsp.hardware]
flash_bytes = 0x1FF00                # the eNVM, less the 256 bytes of the boot mode programmer's header
ram_bytes = 0x80000                  # the L2 cache scratchpad the firmware copies itself to and runs from

[bsp.build]
backend = "custom"                   # bsp_cli.py drives the compiler; CROSS_COMPILE selects it
requires_tools = ["riscv-none-elf-gcc", "hwbridge"]

[bsp.primitives]
uart = true                          # UART 0 is MMUART4, UART 1 is MMUART1: two channels of the on-board FlashPro5
led = true                           # 0 is the LED on MSS GPIO1 bit 9
button = false
cpu_cycle_counter = true             # mcycle
cpu_frequency = true
cache_clear = true                   # fence.i: the instruction cache, the only one the E51 has
heap_usage = true
cycle_timer = false
flash_read = false
flash_erase = false
flash_write = false

# One hart runs the application. The E51 always boots first and sets the board up (clocks, DDR, I/O);
# for a U54 it then wakes that hart and parks: the BSP's companion code, in the same image.
[[bsp.cores]]
id = "e51"
cpu = "rv64imac"
description = "hart 0, the monitor hart: boots first, sets the board up, wakes the others"

[[bsp.cores]]
id = "u54"
cpu = "rv64gc"
count = 4
description = "harts 1 to 4, the application harts, started by the E51"

[[bsp.targets]]
name = "e51"
core_id = "e51"
toolchain = "riscv-none-elf"
cflags = ["-march=rv64imac_zicsr_zifencei", "-mabi=lp64", "-mcmodel=medany", "-mstrict-align"]
run_mode = "auto-after-load"

[[bsp.targets]]
name = "u54"                         # hart 1; harts 2 to 4 are never started
core_id = "u54"
toolchain = "riscv-none-elf"
cflags = ["-march=rv64gc", "-mabi=lp64d", "-mcmodel=medany", "-mstrict-align"]
run_mode = "auto-after-load"
primitives_override = { cache_clear = false }  # nothing invalidates a U54's data cache
